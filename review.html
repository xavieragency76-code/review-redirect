<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>कैफे क्रीम — AI Review</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #120e0c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e1815;
      border: 1px solid #332822;
      border-radius: 20px;
      padding: 24px 20px;
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; color: #ffcf87; text-align: center; }
    p { margin: 0 0 14px; font-size: 0.88rem; color: #c7b9ae; text-align: center; }
    textarea {
      width: 100%;
      min-height: 115px;
      border-radius: 12px;
      border: 1px solid #3d3028;
      background: #14100d;
      color: #fff;
      padding: 12px;
      font-size: 0.94rem;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    button, a.btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-new { background: #2d231d; color: #ffcf87; border: 1px solid #4e3c31; }
    .btn-copy { background: #3b82f6; color: #fff; }
    .btn-go { background: #22c55e; color: #081b0f; }
    .msg { text-align: center; font-size: 0.82rem; color: #86efac; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>कैफे क्रीम</h1>
    <p>Kuch likhne ki zarurat nahi — AI review ready hai</p>
    <textarea id="txt" readonly></textarea>
    <button class="btn-new" id="newBtn" type="button">Generate Another AI Review</button>
    <button class="btn-copy" id="copyBtn" type="button">Copy Review</button>
    <a class="btn btn-go" href="https://search.google.com/local/writereview?placeid=ChIJ1RejeACFXjkRqJjpqfFxB40" target="_blank" rel="noopener noreferrer">Open Google Review</a>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJ1RejeACFXjkRqJjpqfFxB40";
    const list = [
      "Had a great visit to कैफे क्रीम near Vijay Cross Road in Navrangpura. Loved the coffee and cozy vibe—super relaxing spot to hang out and unwind.",
      "Really enjoyed my time at कैफे क्रीम! Friendly staff, nice ambiance, and a great place around University Road to catch up with friends.",
      "Stopped by कैफे क्रीम in Navrangpura and had a wonderful experience. Fresh drinks, comfortable seating, and a welcoming atmosphere.",
      "Solid cafe near Vijay Cross Road! कैफे क्रीम offers a calm vibe, tasty beverages, and quick service."
    ];

    let i = 0;
    const txt = document.getElementById("txt");
    const msg = document.getElementById("msg");

    function nextReview() {
      txt.value = list[i % list.length];
      i++;
      msg.textContent = "";
    }

    document.getElementById("newBtn").addEventListener("click", nextReview);

    document.getElementById("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(txt.value);
      msg.textContent = "Copied to clipboard!";
    });

    nextReview();
  </script>
</body>
</html>
